<div id="role"><b>Shaivil Patel</b>AI Generalist &amp; UI/UX Designer</div>
<div id="cue"><span>Scroll</span><i></i></div></section>
<script>
(function(){
var hero=document.getElementById('hero'),site=document.getElementById('site'),
name=document.getElementById('name'),photo=document.getElementById('photo'),
role=document.getElementById('role'),cue=document.getElementById('cue');
var p=0,target=0,done=false,raf=0,SPAN=950;
function ss(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)}
function render(){
  var f=ss(0,.78,p),n=ss(0,.9,p),bg=ss(.55,1,p),s=ss(.25,1,p);
  photo.style.opacity=1-f;
  photo.style.filter='blur('+(p*16).toFixed(2)+'px)';
  photo.style.transform='translateX(-60%) translateY('+(-p*7).toFixed(2)+'vh) scale('+(1+p*.09).toFixed(4)+')';
  name.style.opacity=1-n;
  name.style.transform='translateX(-50%) translateY('+(-p*5).toFixed(2)+'vh) scale('+(1+p*.16).toFixed(4)+')';
  role.style.opacity=1-ss(0,.4,p);
  cue.style.opacity=1-ss(0,.18,p);
  hero.style.opacity=1-bg;
  site.style.opacity=s;
  site.style.transform='translateY('+((1-s)*3).toFixed(2)+'vh)';
}
function tick(){
  p+=(target-p)*.14;
  if(Math.abs(target-p)<.0004)p=target;
  render();
  if(p>=1&&!done){done=true;hero.style.display='none';site.style.transform='none';try{site.contentWindow.focus()}catch(e){}}
  else if(p<1&&done){done=false;hero.style.display='';}
  raf=(p!==target)?requestAnimationFrame(tick):0;
}
function go(t){target=Math.min(1,Math.max(0,t));if(!raf)raf=requestAnimationFrame(tick)}
function push(d){go(target+d/SPAN)}
window.addEventListener('wheel',function(e){if(done)return;e.preventDefault();push(e.deltaY)},{passive:false});
var ty=null;
window.addEventListener('touchstart',function(e){if(!done)ty=e.touches[0].clientY},{passive:true});
window.addEventListener('touchmove',function(e){if(done||ty===null)return;var y=e.touches[0].clientY;push((ty-y)*2.2);ty=y;e.preventDefault()},{passive:false});
window.addEventListener('keydown',function(e){
  if(done)return;var k=e.key;
  if(k==='ArrowDown'||k==='PageDown'||k===' '||k==='Enter'){e.preventDefault();push(k==='ArrowDown'?220:700)}
  else if(k==='ArrowUp'||k==='PageUp'){e.preventDefault();push(k==='ArrowUp'?-220:-700)}
});
/* once the portfolio is open, scrolling up from its very top brings the intro back */
function hook(){
  var w;try{w=site.contentWindow;w.addEventListener('wheel',function(e){
    if(!done||e.deltaY>=0)return;
    var y=w.scrollY||w.pageYOffset||0;
    if(y<=2){p=.999;target=.999;done=false;hero.style.display='';render();go(Math.max(0,.999+e.deltaY/SPAN))}
  },{passive:true});}catch(err){}
}
site.addEventListener('load',hook);
render();
})();
</script></body></html>
